# CI de Banana Burn: corre en cada push y en cada PR. main = producción (Vercel), así que nada entra a main sin esto en verde.
# Ver docs/CONTRIBUIR.md. No usa secretos reales: el build usa valores "canario" para comprobar que ninguno llega al navegador.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_VERSION: "22"

jobs:
  checks:
    name: Tipos, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit -p .
      - name: ESLint
        run: npx eslint src scripts --quiet
      - name: Vitest
        run: npx vitest run

  build:
    name: Build de producción y revisión del bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Público de ejemplo (sin Supabase: la app compila en modo demo).
      NEXT_PUBLIC_SITE_URL: https://www.bananaburn.app
      # Valores canario: si alguno aparece en .next/static, el paso "Revisar bundle" falla.
      SUPABASE_SERVICE_ROLE_KEY: ci_canary_service_role_8f2a91
      ONVO_SECRET_KEY: ci_canary_onvo_secret_3b7c40
      ONVO_WEBHOOK_SECRET: ci_canary_onvo_webhook_5d1e62
      ANTHROPIC_API_KEY: ci_canary_anthropic_9a0b13
      CRON_SECRET: ci_canary_cron_secret_7c4d85
      RESEND_API_KEY: ci_canary_resend_key_2e6f37
      EMAIL_UNSUB_SECRET: ci_canary_unsub_secret_4a8b59
      VAPID_PRIVATE_KEY: ci_canary_vapid_private_6c0d71
      REFERRAL_SECRET: ci_canary_referral_secret_1f3e24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Caché de Next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --no-audit --no-fund
      - name: next build
        run: npx next build
      - name: Revisar bundle (sin mapas de fuente ni secretos, minificado)
        run: node scripts/check-client-bundle.mjs

  sql:
    name: SQL (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [lanzamiento, beta-off]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Cliente de Postgres
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Migraciones + suites multiusuario y comunidad
        run: bash scripts/ci-sql.sh bb_ci ${{ matrix.mode == 'beta-off' && 'beta-off' || '' }}
