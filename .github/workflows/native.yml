# App nativa (Capacitor): compila el APK de debug de Android en cada cambio de lo nativo y, a pedido, la app de iOS para
# el simulador. El APK queda como artefacto del run (Actions → este workflow → Artifacts) para instalarlo por USB con
# `adb install -r app-debug.apk`. Ver docs/app-nativa.md y docs/pendientes-andres.md. No usa secretos de producción.
name: App nativa

on:
  push:
    branches: ["feature/app-nativa", "main"]
    paths:
      - "android/**"
      - "ios/**"
      - "native/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/native-*.mjs"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "native/**"
      - "capacitor.config.ts"
      - ".github/workflows/native.yml"
  workflow_dispatch:
    inputs:
      server_url:
        description: "Servidor que carga la app (vacío = https://www.bananaburn.app; por ejemplo el preview de Vercel)"
        required: false
        default: ""
      ios:
        description: "Compilar también iOS para el simulador (usa minutos de macOS)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  CAP_SERVER_URL: ${{ github.event.inputs.server_url }}

jobs:
  android:
    name: Android (APK de debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci --no-audit --no-fund
      # Llave de debug fija (secreto opcional ANDROID_DEBUG_KEYSTORE_B64): así su huella SHA-256 puede ir en
      # ANDROID_CERT_SHA256 de Vercel y los App Links se verifican en el APK de prueba. Sin el secreto, Gradle crea una
      # llave nueva en cada run (la app funciona igual, pero los enlaces abren el navegador).
      - name: Llave de debug fija
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: Sincronizar Capacitor
        run: npm run native:sync
      - name: Compilar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Huella del certificado (para assetlinks.json)
        run: |
          {
            echo "### APK de debug"
            echo "Servidor: ${CAP_SERVER_URL:-https://www.bananaburn.app}"
            echo
            echo "Huella SHA-256 de la llave de debug:"
            echo '```'
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA256:" | sed 's/.*SHA256: //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: banana-burn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  ios:
    name: iOS (simulador)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sincronizar Capacitor
        run: npm run native:sync
      - name: Compilar para el simulador (sin firmar)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
